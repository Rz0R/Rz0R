name: Update GitHub Stats

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate statistics
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=rz0r&show_icons=true&line_height=27&title_color=ffffff&text_color=c9cacc&icon_color=2bbc8a&bg_color=1d1f21
          path: profile/stats.svg
          core_version: "2.2.0"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: username=rz0r&hide=css,html,tex&title_color=ffffff&text_color=c9cacc&icon_color=2bbc8a&bg_color=1d1f21&langs_count=3
          path: profile/top-langs.svg
          core_version: "2.2.0"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Statistics have not changed."
            exit 0
          fi
          git commit -m "Update GitHub Stats cards"
          git pull --rebase origin main
          git push origin HEAD:main
